name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Make wrapper executable
        run: chmod +x gradlew
      - name: Lint
        run: ./gradlew ktlintCheck
      - name: Prepare signing key
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          KEYSTORE_B64: ${{ secrets.ERGON_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::Missing ERGON_KEYSTORE_BASE64 secret, refusing to publish a release without the signing key"
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/ergon.jks"
      - name: Build APK
        env:
          ERGON_KEYSTORE_FILE: ${{ runner.temp }}/ergon.jks
          ERGON_KEYSTORE_PASSWORD: ${{ secrets.ERGON_KEYSTORE_PASSWORD }}
          ERGON_KEY_ALIAS: ${{ secrets.ERGON_KEY_ALIAS }}
          ERGON_KEY_PASSWORD: ${{ secrets.ERGON_KEY_PASSWORD }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            ./gradlew assembleRelease --stacktrace \
              -PergonVersionName="${GITHUB_REF_NAME#v}" -PergonVersionCode="${{ github.run_number }}"
          else
            ./gradlew assembleRelease --stacktrace
          fi
          cp app/build/outputs/apk/release/app-release.apk ergon.apk
      - uses: actions/upload-artifact@v7
        with:
          name: ergon-apk
          path: ergon.apk
          archive: false
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" ergon.apk --title "$GITHUB_REF_NAME" --generate-notes
